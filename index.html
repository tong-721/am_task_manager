<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AM Task Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        .task-checkbox:checked + span { text-decoration: line-through; color: #9ca3af; }
        .priority-p0 { background-color: #fee2e2; color: #dc2626; }
        .priority-p1 { background-color: #fef3c7; color: #d97706; }
        .priority-p2 { background-color: #dbeafe; color: #2563eb; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 50; align-items: center; justify-content: center; }
        .modal.active { display: flex; }
        .modal-content { background: white; padding: 1.5rem; border-radius: 0.5rem; max-width: 500px; width: 90%; max-height: 80vh; overflow-y: auto; }
        .sortable-ghost { opacity: 0.4; background: #e5e7eb; }
        .sync-btn { animation: pulse 2s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.8; } }
        .syncing { animation: spin 1s linear infinite; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-100 min-h-screen">
    <div id="app" class="container mx-auto p-4 max-w-6xl">
        <!-- Login Page -->
        <div id="loginPage" class="max-w-md mx-auto mt-20 bg-white rounded-lg shadow-lg p-6">
            <h1 class="text-2xl font-bold text-center mb-6 text-blue-600">AM Task Manager</h1>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">选择或输入 AM 名称</label>
                    <input type="text" id="amInput" list="amList" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-blue-500" placeholder="输入 AM 名称...">
                    <datalist id="amList"></datalist>
                </div>
                <button onclick="login()" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">进入</button>
                <button onclick="showClearConfirm()" class="w-full bg-red-100 text-red-600 py-2 rounded-lg hover:bg-red-200 transition text-sm">⚠️ 清空所有任务</button>
            </div>
        </div>

        <!-- Main App -->
        <div id="mainApp" class="hidden">
            <!-- Header -->
            <div class="bg-white rounded-lg shadow p-4 mb-4">
                <div class="flex justify-between items-center flex-wrap gap-2">
                    <div>
                        <h1 class="text-xl font-bold text-gray-800">AM Task Manager</h1>
                        <p class="text-sm text-gray-600">当前 AM: <span id="currentAM" class="font-semibold text-blue-600"></span></p>
                    </div>
                    <div class="flex gap-2 flex-wrap">
                        <select id="groupBy" onchange="renderTasks()" class="px-3 py-2 border border-gray-300 rounded-lg text-sm">
                            <option value="task">按任务分组</option>
                            <option value="seller">按卖家分组</option>
                        </select>
                        <button onclick="showAddModal()" class="bg-green-600 text-white px-4 py-2 rounded-lg hover:bg-green-700 text-sm">+ 添加任务</button>
                        <button onclick="exportToExcel()" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 text-sm">📥 导出</button>
                        <label class="bg-purple-600 text-white px-4 py-2 rounded-lg hover:bg-purple-700 text-sm cursor-pointer">
                            <input type="file" id="importFile" accept=".xlsx,.xls" onchange="importFromExcel(this)" class="hidden">
</label>
<button onclick="showSyncModal()" class="sync-btn bg-orange-500 text-white px-4 py-2 rounded-lg hover:bg-orange-600 text-sm">☁️ 同步</button>
<button onclick="logout()" class="bg-gray-600 text-white px-4 py-2 rounded-lg hover:bg-gray-700 text-sm">退出</button>
</div>
</div>
</div>
            <!-- Progress -->
        <div class="bg-white rounded-lg shadow p-4 mb-4">
            <div class="flex justify-between items-center">
                <span class="text-sm font-medium text-gray-600">总体进度</span>
                <span id="progressText" class="text-sm font-bold text-blue-600"></span>
            </div>
            <div class="w-full bg-gray-200 rounded-full h-2.5 mt-2">
                <div id="progressBar" class="bg-blue-600 h-2.5 rounded-full transition-all" style="width: 0%"></div>
            </div>
        </div>
        <!-- Tasks Container -->
        <div id="tasksContainer" class="space-y-4"></div>
    </div>
</div>
<!-- Add Task Modal -->
<div id="addModal" class="modal">
    <div class="modal-content">
        <h2 class="text-xl font-bold mb-4">添加新任务</h2>
        <div class="space-y-3">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">任务名称</label>
                <input type="text" id="newTaskName" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">优先级</label>
                <select id="newTaskPriority" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                    <option value="P0">P0 - 紧急</option>
                    <option value="P1">P1 - 重要</option>
                    <option value="P2" selected>P2 - 普通</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">卖家（多个用逗号分隔）</label>
                <textarea id="newTaskSellers" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="例如：卖家A, 卖家B, 卖家C"></textarea>
            </div>
        </div>
        <div class="flex gap-2 mt-6">
            <button onclick="addTask()" class="flex-1 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">添加</button>
            <button onclick="closeModal('addModal')" class="flex-1 bg-gray-300 text-gray-700 py-2 rounded-lg hover:bg-gray-400">取消</button>
        </div>
    </div>
</div>
<!-- Edit Task Modal -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <h2 class="text-xl font-bold mb-4">编辑任务</h2>
        <input type="hidden" id="editTaskId">
        <div class="space-y-3">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">任务名称</label>
                <input type="text" id="editTaskName" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">优先级</label>
                <select id="editTaskPriority" class="w-full px-3 py-2 border border-gray-300 rounded-lg">
                    <option value="P0">P0 - 紧急</option>
                    <option value="P1">P1 - 重要</option>
                    <option value="P2">P2 - 普通</option>
                </select>
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">卖家（多个用逗号分隔）</label>
<textarea id="editTaskSellers" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500"></textarea>
</div>
</div>
<div class="flex gap-2 mt-6">
<button onclick="saveEditTask()" class="flex-1 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">保存</button>
<button onclick="deleteTask()" class="flex-1 bg-red-600 text-white py-2 rounded-lg hover:bg-red-700">删除</button>
<button onclick="closeModal('editModal')" class="flex-1 bg-gray-300 text-gray-700 py-2 rounded-lg hover:bg-gray-400">取消</button>
</div>
</div>
</div>
    <!-- Add Seller Modal -->
<div id="addSellerModal" class="modal">
    <div class="modal-content">
        <h2 class="text-xl font-bold mb-4">添加卖家</h2>
        <input type="hidden" id="addSellerTaskId">
        <div class="space-y-3">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">卖家名称（多个用逗号分隔）</label>
                <textarea id="addSellerNames" rows="3" class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" placeholder="例如：新卖家A, 新卖家B"></textarea>
            </div>
        </div>
        <div class="flex gap-2 mt-6">
            <button onclick="saveAddSellers()" class="flex-1 bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700">添加</button>
            <button onclick="closeModal('addSellerModal')" class="flex-1 bg-gray-300 text-gray-700 py-2 rounded-lg hover:bg-gray-400">取消</button>
        </div>
    </div>
</div>
<!-- Sync Modal -->
<div id="syncModal" class="modal">
    <div class="modal-content">
        <h2 class="text-xl font-bold mb-4">☁️ 云端同步</h2>
        <p class="text-sm text-gray-600 mb-4">将当前 AM 的任务数据同步到云端，或从云端下载。</p>
        <div class="space-y-3">
            <button onclick="uploadToCloud()" class="w-full bg-green-600 text-white py-3 rounded-lg hover:bg-green-700 flex items-center justify-center gap-2">
                <span id="uploadIcon">⬆️</span>
                <span id="uploadText">上传到云端</span>
            </button>
            <button onclick="downloadFromCloud()" class="w-full bg-blue-600 text-white py-3 rounded-lg hover:bg-blue-700 flex items-center justify-center gap-2">
                <span id="downloadIcon">⬇️</span>
                <span id="downloadText">从云端下载</span>
            </button>
            <div id="syncStatus" class="text-center text-sm hidden"></div>
        </div>
        <div class="flex gap-2 mt-6">
            <button onclick="closeModal('syncModal')" class="flex-1 bg-gray-300 text-gray-700 py-2 rounded-lg hover:bg-gray-400">关闭</button>
        </div>
    </div>
</div>
<!-- Clear Confirm Modal -->
<div id="clearModal" class="modal">
    <div class="modal-content">
        <h2 class="text-xl font-bold mb-4 text-red-600">⚠️ 危险操作</h2>
        <p class="mb-4">确定要清空所有 AM 的任务数据吗？此操作不可恢复！</p>
        <div class="flex gap-2">
            <button onclick="clearAllData()" class="flex-1 bg-red-600 text-white py-2 rounded-lg hover:bg-red-700">确定清空</button>
            <button onclick="closeModal('clearModal')" class="flex-1 bg-gray-300 text-gray-700 py-2 rounded-lg hover:bg-gray-400">取消</button>
        </div>
    </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
    // Firebase 配置
        const firebaseConfig = {
            apiKey: "AIzaSyAwQmMXoM655YzIu-VASGJXaNFs6_cnfaw",
            authDomain: "amtaskmanager.firebaseapp.com",
            projectId: "amtaskmanager",
            storageBucket: "amtaskmanager.firebasestorage.app",
            messagingSenderId: "979314331618",
            appId: "1:979314331618:web:41fd4edd61ce40a967b3bb"
        };

        // 初始化 Firebase
        let db;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.firestore();
            console.log("Firebase 初始化成功");
        } catch (e) {
            console.error("Firebase 初始化失败:", e);
        }

        let currentAM = '';
        let tasks = [];
        let editingTaskId = null;

        // 页面加载时更新 AM 列表
        window.onload = function() {
            updateAMList();
        };

        function updateAMList() {
            const allData = JSON.parse(localStorage.getItem('amTasks') || '{}');
            const amList = document.getElementById('amList');
            amList.innerHTML = '';
            Object.keys(allData).forEach(am => {
                const option = document.createElement('option');
                option.value = am;
                amList.appendChild(option);
            });
        }

        function login() {
            const amInput = document.getElementById('amInput').value.trim();
            if (!amInput) {
                alert('请输入 AM 名称');
                return;
            }
            currentAM = amInput;
            document.getElementById('currentAM').textContent = currentAM;
            document.getElementById('loginPage').classList.add('hidden');
            document.getElementById('mainApp').classList.remove('hidden');
            loadTasks();
        }

        function logout() {
            currentAM = '';
            document.getElementById('mainApp').classList.add('hidden');
            document.getElementById('loginPage').classList.remove('hidden');
            document.getElementById('amInput').value = '';
            updateAMList();
        }

        function loadTasks() {
            const allData = JSON.parse(localStorage.getItem('amTasks') || '{}');
            tasks = allData[currentAM] || [];
            renderTasks();
        }

        function saveTasks() {
            const allData = JSON.parse(localStorage.getItem('amTasks') || '{}');
            allData[currentAM] = tasks;
            localStorage.setItem('amTasks', JSON.stringify(allData));
            renderTasks();
        }

        function renderTasks() {
            const container = document.getElementById('tasksContainer');
            const groupBy = document.getElementById('groupBy').value;
            container.innerHTML = '';

            if (tasks.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-500 py-8">暂无任务，点击"添加任务"开始</div>';
                updateProgress();
                return;
            }

            if (groupBy === 'task') {
                // 按任务分组
                tasks.forEach(task => {
                    const completedCount = task.sellers.filter(s => s.completed).length;
                    const card = createTaskCard(task, completedCount);
                    container.appendChild(card);
                });
            } else {
                // 按卖家分组
                const sellerMap = {};
                tasks.forEach(task => {
task.sellers.forEach(seller => {
if (!sellerMap[seller.name]) {
sellerMap[seller.name] = [];
}
sellerMap[seller.name].push({
taskName: task.name,
taskId: task.id,
completed: seller.completed,
priority: task.priority
});
});
});
                Object.keys(sellerMap).sort().forEach(sellerName => {
                const sellerTasks = sellerMap[sellerName];
                const completedCount = sellerTasks.filter(t => t.completed).length;
                const card = createSellerCard(sellerName, sellerTasks, completedCount);
                container.appendChild(card);
            });
        }
        updateProgress();
    }
    function createTaskCard(task, completedCount) {
        const div = document.createElement('div');
        div.className = 'bg-white rounded-lg shadow p-4';
        
        const priorityClass = `priority-${task.priority.toLowerCase()}`;
        
        let sellersHtml = task.sellers.map((seller, index) => `
            <div class="flex items-center gap-2 py-1">
                <input type="checkbox" class="task-checkbox w-4 h-4" 
                       ${seller.completed ? 'checked' : ''} 
                       onchange="toggleSeller('${task.id}', '${seller.name}')">
                <span class="${seller.completed ? 'line-through text-gray-400' : ''}">${seller.name}</span>
            </div>
        `).join('');
        div.innerHTML = `
            <div class="flex justify-between items-start mb-3">
                <div class="flex items-center gap-2">
                    <span class="px-2 py-1 rounded text-xs font-bold ${priorityClass}">${task.priority}</span>
                    <h3 class="font-bold text-lg cursor-pointer hover:text-blue-600" onclick="openEditModal('${task.id}')">${task.name}</h3>
                </div>
                <div class="text-sm text-gray-500">${completedCount}/${task.sellers.length}</div>
            </div>
            <div class="space-y-1 mb-3">
                ${sellersHtml}
            </div>
            <button onclick="openAddSellerModal('${task.id}')" class="text-sm text-blue-600 hover:text-blue-800">+ 添加卖家</button>
        `;
        
        return div;
    }
    function createSellerCard(sellerName, sellerTasks, completedCount) {
        const div = document.createElement('div');
        div.className = 'bg-white rounded-lg shadow p-4';
        
        let tasksHtml = sellerTasks.map(task => {
            const priorityClass = `priority-${task.priority.toLowerCase()}`;
            return `
                <div class="flex items-center gap-2 py-1">
                    <input type="checkbox" class="task-checkbox w-4 h-4" 
                           ${task.completed ? 'checked' : ''} 
                           onchange="toggleSellerByName('${task.taskId}', '${sellerName}')">
                    <span class="px-1.5 py-0.5 rounded text-xs ${priorityClass}">${task.priority}</span>
                    <span class="${task.completed ? 'line-through text-gray-400' : ''}">${task.taskName}</span>
                </div>
            `;
        }).join('');
        div.innerHTML = `
            <div class="flex justify-between items-start mb-3">
                <h3 class="font-bold text-lg">${sellerName}</h3>
                <div class="text-sm text-gray-500">${completedCount}/${sellerTasks.length}</div>
            </div>
            <div class="space-y-1">
                ${tasksHtml}
            </div>
            `;
        return div;
    }
    function updateProgress() {
        let totalSellers = 0;
        let completedSellers = 0;
        
        tasks.forEach(task => {
            task.sellers.forEach(seller => {
                totalSellers++;
                if (seller.completed) completedSellers++;
            });
        });
        
        const percentage = totalSellers > 0 ? Math.round((completedSellers / totalSellers) * 100) : 0;
        
        document.getElementById('progressText').textContent = `${completedSellers}/${totalSellers} (${percentage}%)`;
        document.getElementById('progressBar').style.width = `${percentage}%`;
    }
    function toggleSeller(taskId, sellerName) {
        const task = tasks.find(t => t.id === taskId);
        if (task) {
            const seller = task.sellers.find(s => s.name === sellerName);
            if (seller) {
                seller.completed = !seller.completed;
                saveTasks();
            }
        }
    }
    function toggleSellerByName(taskId, sellerName) {
        toggleSeller(taskId, sellerName);
    }
    function showAddModal() {
        document.getElementById('newTaskName').value = '';
        document.getElementById('newTaskPriority').value = 'P2';
        document.getElementById('newTaskSellers').value = '';
        document.getElementById('addModal').classList.add('active');
    }
    function addTask() {
        const name = document.getElementById('newTaskName').value.trim();
        const priority = document.getElementById('newTaskPriority').value;
        const sellersText = document.getElementById('newTaskSellers').value.trim();
        
        if (!name) {
            alert('请输入任务名称');
            return;
        }
        
        if (!sellersText) {
            alert('请输入至少一个卖家');
            return;
        }
        
        const sellers = sellersText.split(/[,，]/).map(s => s.trim()).filter(s => s).map(s => ({
            name: s,
            completed: false
        }));
        
        const newTask = {
            id: Date.now().toString(),
            name: name,
            priority: priority,
            sellers: sellers,
            createdAt: new Date().toISOString()
        };
        
        tasks.push(newTask);
        saveTasks();
        closeModal('addModal');
    }
    function openEditModal(taskId) {
        const task = tasks.find(t => t.id === taskId);
        if (!task) return;
        
        editingTaskId = taskId;
        document.getElementById('editTaskId').value = taskId;
        document.getElementById('editTaskName').value = task.name;
        document.getElementById('editTaskPriority').value = task.priority;
        document.getElementById('editTaskSellers').value = task.sellers.map(s => s.name).join(', ');
        document.getElementById('editModal').classList.add('active');
    }
    function saveEditTask() {
        const task = tasks.find(t => t.id === editingTaskId);
        if (!task) return;
        
        const name = document.getElementById('editTaskName').value.trim();
        const priority = document.getElementById('editTaskPriority').value;
        const sellersText = document.getElementById('editTaskSellers').value.trim();
        
        if (!name) {
            alert('请输入任务名称');
            return;
        }
        
        // 保留原有的完成状态
        const sellerNames = sellersText.split(/[,，]/).map(s => s.trim()).filter(s => s);
        const newSellers = sellerNames.map(name => {
const existing = task.sellers.find(s => s.name === name);
return {
name: name,
completed: existing ? existing.completed : false
};
});
        task.name = name;
        task.priority = priority;
        task.sellers = newSellers;
        
        saveTasks();
        closeModal('editModal');
        editingTaskId = null;
    }
    function deleteTask() {
        if (!confirm('确定要删除这个任务吗？')) return;
        
        tasks = tasks.filter(t => t.id !== editingTaskId);
        saveTasks();
        closeModal('editModal');
        editingTaskId = null;
    }
    function openAddSellerModal(taskId) {
        document.getElementById('addSellerTaskId').value = taskId;
        document.getElementById('addSellerNames').value = '';
        document.getElementById('addSellerModal').classList.add('active');
    }
    function saveAddSellers() {
        const taskId = document.getElementById('addSellerTaskId').value;
        const task = tasks.find(t => t.id === taskId);
        if (!task) return;
        
        const sellersText = document.getElementById('addSellerNames').value.trim();
        if (!sellersText) {
            alert('请输入卖家名称');
            return;
        }
        
        const newSellers = sellersText.split(/[,，]/).map(s => s.trim()).filter(s => s);
        newSellers.forEach(name => {
            if (!task.sellers.find(s => s.name === name)) {
                task.sellers.push({ name: name, completed: false });
            }
        });
        
        saveTasks();
        closeModal('addSellerModal');
    }
    function closeModal(modalId) {
        document.getElementById(modalId).classList.remove('active');
    }
    function showClearConfirm() {
        document.getElementById('clearModal').classList.add('active');
    }
    function clearAllData() {
        localStorage.removeItem('amTasks');
        updateAMList();
        closeModal('clearModal');
        alert('所有数据已清空');
    }
    // ========== 云端同步功能 ==========
    function showSyncModal() {
        document.getElementById('syncStatus').classList.add('hidden');
        document.getElementById('syncModal').classList.add('active');
    }
    async function uploadToCloud() {
        if (!db) {
            alert('Firebase 未初始化，请刷新页面重试');
            return;
        }
        const uploadBtn = document.querySelector('button[onclick="uploadToCloud()"]');
        const uploadIcon = document.getElementById('uploadIcon');
        const uploadText = document.getElementById('uploadText');
        const statusDiv = document.getElementById('syncStatus');
        uploadBtn.disabled = true;
        uploadIcon.classList.add('syncing');
        uploadText.textContent = '上传中...';
        statusDiv.classList.remove('hidden');
        statusDiv.textContent = '正在上传到云端...';
        statusDiv.className = 'text-center text-sm text-blue-600';
        try {
            // 准备数据
            const dataToUpload = {
                amName: currentAM,
                tasks: tasks,
                updatedAt: new Date().toISOString(),
                device: navigator.userAgent
            };
            // 上传到 Firestore
            await db.collection('tasks').doc(currentAM).set(dataToUpload);
            statusDiv.textContent = '✅ 上传成功！';
            statusDiv.className = 'text-center text-sm text-green-600';
            uploadText.textContent = '上传成功';
            setTimeout(() => {
uploadBtn.disabled = false;
uploadIcon.classList.remove('syncing');
uploadText.textContent = '上传到云端';
}, 2000);
            } catch (error) {
            console.error('上传失败:', error);
            statusDiv.textContent = '❌ 上传失败: ' + error.message;
            statusDiv.className = 'text-center text-sm text-red-600';
            uploadBtn.disabled = false;
            uploadIcon.classList.remove('syncing');
            uploadText.textContent = '上传到云端';
        }
    }
    async function downloadFromCloud() {
        if (!db) {
            alert('Firebase 未初始化，请刷新页面重试');
            return;
        }
        const downloadBtn = document.querySelector('button[onclick="downloadFromCloud()"]');
        const downloadIcon = document.getElementById('downloadIcon');
        const downloadText = document.getElementById('downloadText');
        const statusDiv = document.getElementById('syncStatus');
        downloadBtn.disabled = true;
        downloadIcon.classList.add('syncing');
        downloadText.textContent = '下载中...';
        statusDiv.classList.remove('hidden');
        statusDiv.textContent = '正在从云端下载...';
        statusDiv.className = 'text-center text-sm text-blue-600';
        try {
            // 从 Firestore 下载
            const doc = await db.collection('tasks').doc(currentAM).get();
            if (!doc.exists) {
                statusDiv.textContent = '⚠️ 云端没有此 AM 的数据';
                statusDiv.className = 'text-center text-sm text-yellow-600';
                downloadBtn.disabled = false;
                downloadIcon.classList.remove('syncing');
                downloadText.textContent = '从云端下载';
                return;
            }
            const data = doc.data();
            if (confirm(`找到 ${data.amName} 的云端数据，更新于 ${new Date(data.updatedAt).toLocaleString()}。\n\n确定要覆盖本地数据吗？`)) {
                tasks = data.tasks || [];
                saveTasks();
                statusDiv.textContent = '✅ 下载成功！数据已同步';
                statusDiv.className = 'text-center text-sm text-green-600';
                downloadText.textContent = '下载成功';
            } else {
                statusDiv.textContent = '已取消';
                statusDiv.className = 'text-center text-sm text-gray-600';
            }
            setTimeout(() => {
                downloadBtn.disabled = false;
                downloadIcon.classList.remove('syncing');
                downloadText.textContent = '从云端下载';
            }, 2000);
        } catch (error) {
            console.error('下载失败:', error);
            statusDiv.textContent = '❌ 下载失败: ' + error.message;
            statusDiv.className = 'text-center text-sm text-red-600';
            downloadBtn.disabled = false;
            downloadIcon.classList.remove('syncing');
            downloadText.textContent = '从云端下载';
        }
    }
    // ========== Excel 导入导出 ==========
    function exportToExcel() {
        if (tasks.length === 0) {
            alert('没有数据可导出');
            return;
        }
        const data = [];
        tasks.forEach(task => {
            task.sellers.forEach(seller => {
                data.push({
                    'AM': currentAM,
                    '任务名称': task.name,
                    '优先级': task.priority,
                    '卖家': seller.name,
                    '状态': seller.completed ? '已完成' : '未完成'
                });
            });
        });
        const ws = XLSX.utils.json_to_sheet(data);
        const wb = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb, ws, 'Tasks');

        const date = new Date().toISOString().split('T')[0];
XLSX.writeFile(wb, AM_Tasks_${currentAM}_${date}.xlsx);
}
    function importFromExcel(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array' });
                const sheet = workbook.Sheets[workbook.SheetNames[0]];
                const jsonData = XLSX.utils.sheet_to_json(sheet);
                if (jsonData.length === 0) {
                    alert('文件中没有数据');
                    return;
                }
                // 解析导入的数据
                const importedTasks = {};
                jsonData.forEach(row => {
                    const taskName = row['任务名称'] || row['Task'] || row['task'];
                    const sellerName = row['卖家'] || row['Seller'] || row['seller'];
                    const priority = row['优先级'] || row['Priority'] || row['priority'] || 'P2';
                    const status = row['状态'] || row['Status'] || row['status'];
                    if (!taskName || !sellerName) return;
                    if (!importedTasks[taskName]) {
                        importedTasks[taskName] = {
                            id: Date.now().toString() + Math.random().toString(36).substr(2, 5),
                            name: taskName,
                            priority: ['P0', 'P1', 'P2'].includes(priority) ? priority : 'P2',
                            sellers: [],
                            createdAt: new Date().toISOString()
                        };
                    }
                    importedTasks[taskName].sellers.push({
                        name: sellerName,
                        completed: status === '已完成' || status === 'Done' || status === true
                    });
                });
                // 合并到现有任务
                Object.values(importedTasks).forEach(newTask => {
                    const existingTask = tasks.find(t => t.name === newTask.name);
                    if (existingTask) {
                        // 合并卖家
                        newTask.sellers.forEach(newSeller => {
                            if (!existingTask.sellers.find(s => s.name === newSeller.name)) {
                                existingTask.sellers.push(newSeller);
                            }
                        });
                    } else {
                        tasks.push(newTask);
                    }
                });
                saveTasks();
                alert(`成功导入 ${Object.keys(importedTasks).length} 个任务`);
                
            } catch (err) {
                console.error(err);
                alert('导入失败：' + err.message);
            }
        };
        reader.readAsArrayBuffer(file);
        input.value = '';
    }
</script>
